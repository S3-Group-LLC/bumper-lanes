name: Backup

# Saves three things, so any mistake can be undone:
#   1. Code       — a tag backup/YYYY-MM-DD pointing at your live code (main)
#   2. Live site  — recent live deployments + the NAMES of your settings (never values)
#   3. Data       — database (roles, structure, rows) + stored files, encrypted with
#                   BACKUP_PASSPHRASE, kept for backups.retention_days days
#
# Runs every night, whenever you (or the backup-now skill) start it, and automatically
# before every database change and every restore (they call this workflow first).
#
# Secrets (GitHub → Settings → Secrets and variables → Actions) — or ask your agent to
# "connect backups" (npm run connect-backups):
#   SUPABASE_DB_URL        Session pooler connection string (Supabase → Connect)
#   SUPABASE_SECRET_KEY    secret key, to back up stored files (Supabase → Project Settings → API Keys)
#   BACKUP_PASSPHRASE      a long password you choose; keep a copy somewhere safe
# Older setups: SUPABASE_ACCESS_TOKEN still works instead of SUPABASE_SECRET_KEY.
#
# Not set up yet? The run just notes it. Set up but something is missing or rejected? The
# run saves what it can (your database first), then fails with the reason.
#
# Each saved backup is recorded in your database (bumper_lanes.backup_runs), so your
# site's /status page shows when the last one ran.

on:
  schedule:
    - cron: "23 7 * * *" # every day at 07:23 UTC (night-time in the Americas)
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact:
        description: Name of the saved backup
        value: ${{ jobs.backup.outputs.artifact }}
      info:
        description: What the backup covered (backup-info.json, one line)
        value: ${{ jobs.backup.outputs.info }}

permissions:
  contents: write # create the backup/YYYY-MM-DD tag
  deployments: read # read the list of live-site deployments

jobs:
  backup:
    name: Back up code, live site and data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: backup-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      artifact: ${{ steps.save.outputs.artifact }}
      info: ${{ steps.save.outputs.info }}
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Work folder
        run: echo "OUT=$RUNNER_TEMP/backup" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: bash scripts/setup.sh

      - name: "1. Code: tag today's live code"
        run: |
          git fetch --quiet origin main
          tag="backup/$(date -u +%Y-%m-%d)"
          git tag -f "$tag" origin/main
          # Moves today's tag if it already exists; earlier days' tags are never changed.
          git push --quiet origin "+refs/tags/$tag"
          echo "BACKUP_CODE_TAG=$tag" >> "$GITHUB_ENV"
          echo "Tagged $(git rev-parse --short origin/main) as $tag"

      - name: "2. Live site: deployments and setting names"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/backup/site-info.mjs "$OUT/site"

      - name: Find the Supabase project
        if: env.SUPABASE_DB_URL != ''
        # Only this step sees the key secret; it passes it on (masked) to later steps.
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup/supabase-project.mjs "$GITHUB_ENV"

      - name: Install the Supabase CLI
        if: env.SUPABASE_DB_URL != ''
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: "3. Data: database and files (encrypted)"
        if: env.SUPABASE_DB_URL != ''
        run: bash scripts/backup/backup.sh "$OUT"

      - name: "3. Data: skipped"
        if: env.SUPABASE_DB_URL == ''
        run: echo "::notice::Data not backed up yet — ask your agent to \"connect backups\" (or add the SUPABASE_DB_URL, SUPABASE_SECRET_KEY and BACKUP_PASSPHRASE secrets) to switch it on."

      - name: Save the backup
        id: save
        run: |
          days="$(node -e 'const {parse}=require("yaml");const c=parse(require("fs").readFileSync("bumper-lanes.config.yaml","utf8"))||{};console.log(Number(c?.backups?.retention_days)||14)')"
          kind=backup; [ -f "$OUT/data.tar.gz.gpg" ] || kind=backup-nodata
          echo "artifact=$kind-$(date -u +%Y-%m-%d)-run${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          echo "days=$days" >> "$GITHUB_OUTPUT"
          info="$(node -e 'try{console.log(JSON.stringify(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))))}catch{console.log("")}' "$OUT/backup-info.json")"
          echo "info=$info" >> "$GITHUB_OUTPUT"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.save.outputs.artifact }}
          path: ${{ env.OUT }}
          retention-days: ${{ steps.save.outputs.days }}
          if-no-files-found: error

      # So your site's /status page can show when the last backup ran.
      - name: Record it for the /status page
        if: env.SUPABASE_DB_URL != ''
        run: node scripts/backup/record-backup.mjs "$OUT/backup-info.json"

      - name: Summary
        run: |
          {
            echo "## Backup saved: \`${{ steps.save.outputs.artifact }}\`"
            echo "Kept for ${{ steps.save.outputs.days }} days."
            if [ -f "$OUT/backup-info.json" ]; then
              echo '```json'; cat "$OUT/backup-info.json"; echo '```'
            else
              echo "Data: not included (Supabase not connected yet)."
            fi
            if [ -n "${STORAGE_PROBLEM:-}" ]; then echo; echo "⚠️ **Stored files:** $STORAGE_PROBLEM"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Last, so the backup is saved first: a half-done backup must never look like a ✓.
      - name: Everything backed up?
        if: env.SUPABASE_DB_URL != ''
        run: node scripts/backup/check-complete.mjs "$OUT/backup-info.json"
